version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: qingtian-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - qingtian-network

  redis:
    image: redis:7-alpine
    container_name: qingtian-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - qingtian-network

  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    container_name: qingtian-nsqlookupd
    restart: unless-stopped
    command: /nsqlookupd
    networks:
      - qingtian-network

  nsqd:
    image: nsqio/nsq:v1.2.1
    container_name: qingtian-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160
    depends_on:
      - nsqlookupd
    networks:
      - qingtian-network

  minio:
    image: minio/minio:latest
    container_name: qingtian-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 安全提示：生产部署请在 .env 或环境变量中设置 MINIO_ROOT_USER/MINIO_ROOT_PASSWORD，
      # 切勿沿用下方开发默认值。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - qingtian-network

  apiserver:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-apiserver
    restart: unless-stopped
    command: ./apiserver -config configs/apiserver.yaml
    environment:
      QT_MONGO_URI: mongodb://mongodb:27017
      QT_REDIS_ADDR: redis:6379
      QT_NSQD_ADDR: nsqd:4150
      QT_NSQ_LOOKUPD_ADDR: nsqlookupd:4161
      QT_MINIO_ENDPOINT: minio:9000
      # 安全提示：必须通过环境变量注入强随机密钥，否则 apiserver 将拒绝启动。
      # 生成方式：openssl rand -hex 32
      QT_JWT_SECRET: ${QT_JWT_SECRET:?请设置 QT_JWT_SECRET 环境变量}
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio
    networks:
      - qingtian-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-scheduler
    restart: unless-stopped
    command: ./scheduler -config configs/scheduler.yaml
    environment:
      QT_MONGO_URI: mongodb://mongodb:27017
      QT_REDIS_ADDR: redis:6379
      QT_NSQD_ADDR: nsqd:4150
      QT_NSQ_LOOKUPD_ADDR: nsqlookupd:4161
      QT_MINIO_ENDPOINT: minio:9000
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio
    networks:
      - qingtian-network

  agent:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-agent
    restart: unless-stopped
    command: ./agent -config configs/agent.yaml
    environment:
      QT_MONGO_URI: mongodb://mongodb:27017
      QT_REDIS_ADDR: redis:6379
      QT_NSQD_ADDR: nsqd:4150
      QT_NSQ_LOOKUPD_ADDR: nsqlookupd:4161
      QT_MINIO_ENDPOINT: minio:9000
      QT_CONTROL_PLANE_URL: http://apiserver:8080
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio
    networks:
      - qingtian-network

  frontend_dev:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: qingtian-frontend-dev
    restart: unless-stopped
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - 80:5173
    environment:
      - VITE_API_HOST=http://apiserver:8080
    depends_on:
      - apiserver
    networks:
      - qingtian-network


volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  qingtian-network:
    driver: bridge
