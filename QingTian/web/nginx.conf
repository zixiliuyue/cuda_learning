server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # 仅对达到一定体积的响应压缩，避免小文件压缩得不偿失。
    gzip_min_length 1024;
    # 兼顾压缩率与 CPU 开销的折中级别。
    gzip_comp_level 6;
    # 为经代理/CDN 缓存的响应正确追加 Vary: Accept-Encoding。
    gzip_vary on;
    # 对代理请求同样启用压缩。
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 禁用缓存：每次都校验，确保部署新版后浏览器立即获取
    # 最新的资源引用，避免旧 index.html 指向已删除的旧哈希文件导致 404。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 构建产物（带内容哈希文件名）可长期强缓存，内容变更即换文件名，
    # immutable 告知浏览器缓存期内无需发起再验证请求。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://apiserver:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
