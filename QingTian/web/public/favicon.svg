  <rect x="28" y="28" width="8" height="8" rx="1.5" fill="#ffffff"/>
  <!-- 四周引脚 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="26" y1="14" x2="26" y2="20"/>
    <line x1="38" y1="14" x2="38" y2="20"/>
    <line x1="26" y1="44" x2="26" y2="50"/>
    <line x1="38" y1="44" x2="38" y2="50"/>
    <line x1="14" y1="26" x2="20" y2="26"/>
    <line x1="14" y1="38" x2="20" y2="38"/>
    <line x1="44" y1="26" x2="50" y2="26"/>
    <line x1="44" y1="38" x2="50" y2="38"/>
  </g>
</svg>
