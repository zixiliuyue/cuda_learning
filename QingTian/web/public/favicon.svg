<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 圆形渐变背景 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165dff"/>
      <stop offset="100%" stop-color="#0f3cad"/>
    </linearGradient>
    <!-- 外发光 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="128" cy="128" r="116" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- GPU 芯片轮廓 -->
  <rect x="68" y="68" width="120" height="120" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>

  <!-- 算力闪电符号 -->
  <path d="M128 48 L148 92 H112 L132 136 L96 100 H128 Z"
        fill="rgba(255,255,255,0.95)" stroke="none" opacity="0.95"/>

  <!-- Q 字母 -->
  <path d="M82 178 Q68 178 68 164 L68 110 Q68 96 82 96 H102 Q116 96 116 110 L116 148 Q116 162 102 166 L122 182 Q118 186 112 186 L90 172 Z"
        fill="white" opacity="0.92"/>
  <path d="M84 166 Q76 166 76 158 L76 114 Q76 106 84 106 H98 Q106 106 106 114 L106 148 Q106 156 98 162 Z"
        fill="url(#bgGrad)" opacity="0.98"/>

  <!-- T 字母 -->
  <rect x="126" y="96" width="44" height="14" rx="7" fill="white" opacity="0.92"/>
  <rect x="141" y="110" width="14" width="82" height="70" rx="7" fill="white" opacity="0.92"/>

  <!-- 芯片引脚装饰 -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round">
    <line x1="56" y1="88" x2="48" y2="88"/>
    <line x1="56" y1="120" x2="48" y2="120"/>
    <line x1="56" y1="152" x2="48" y2="152"/>
    <line x1="56" y1="184" x2="48" y2="184"/>
    <line x1="200" y1="88" x2="208" y2="88"/>
    <line x1="200" y1="120" x2="208" y2="120"/>
    <line x1="200" y1="152" x2="208" y2="152"/>
    <line x1="200" y1="184" x2="208" y2="184"/>
    <line x1="88" y1="200" x2="88" y2="208"/>
    <line x1="120" y1="200" x2="120" y2="208"/>
    <line x1="152" y1="200" x2="152" y2="208"/>
    <line x1="184" y1="200" x2="184" y2="208"/>
    <line x1="88" y1="48" x2="88" y2="56"/>
    <line x1="120" y1="48" x2="120" y2="56"/>
    <line x1="152" y1="48" x2="152" y2="56"/>
    <line x1="184" y1="48" x2="184" y2="56"/>
  </g>
</svg>
