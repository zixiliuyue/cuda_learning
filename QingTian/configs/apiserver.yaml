# QingTian API 服务配置示例
log_level: info
edition: enterprise

server:
  addr: ":8080"

mongo:
  uri: "mongodb://localhost:27017"
  database: "qingtian"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

nsq:
  nsqd_addr: "localhost:4150"
  lookupd_addr: "localhost:4161"
  max_in_flight: 16

minio:
  endpoint: "localhost:9000"
  # 安全提示：以下为 MinIO 本地开发默认凭证，生产环境必须修改，
  # 建议通过环境变量注入而非写入配置文件。
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  bucket: "qingtian"

auth:
  # 安全提示：此为本地开发占位密钥，服务在检测到该默认值时将拒绝启动。
  # 生产环境必须通过环境变量 QT_JWT_SECRET 注入强随机密钥（如 openssl rand -hex 32）。
  jwt_secret: "change-me-in-production"
  token_ttl: 24h

scheduler:
  interval: 2s
  strategy: "binpack"
  node_timeout: 30s
