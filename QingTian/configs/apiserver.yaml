# QingTian API 服务配置示例
log_level: info

server:
  addr: ":8080"

mongo:
  uri: "mongodb://localhost:27017"
  database: "qingtian"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

nsq:
  nsqd_addr: "localhost:4150"
  lookupd_addr: "localhost:4161"
  max_in_flight: 16

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  bucket: "qingtian"

auth:
  jwt_secret: "change-me-in-production"
  token_ttl: 24h

scheduler:
  interval: 2s
  strategy: "binpack"
  node_timeout: 30s
