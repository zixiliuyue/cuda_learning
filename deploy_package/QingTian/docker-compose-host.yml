version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: qingtian-mongodb
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: qingtian-redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data

  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    container_name: qingtian-nsqlookupd
    restart: unless-stopped
    network_mode: host
    command: /nsqlookupd

  nsqd:
    image: nsqio/nsq:v1.2.1
    container_name: qingtian-nsqd
    restart: unless-stopped
    network_mode: host
    command: /nsqd --lookupd-tcp-address=127.0.0.1:4160
    depends_on:
      - nsqlookupd

  minio:
    image: minio/minio:latest
    container_name: qingtian-minio
    restart: unless-stopped
    network_mode: host
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  apiserver:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-apiserver
    restart: unless-stopped
    network_mode: host
    command: ./apiserver -config configs/apiserver.yaml
    environment:
      QT_MONGO_URI: mongodb://127.0.0.1:27017
      QT_REDIS_ADDR: 127.0.0.1:6379
      QT_NSQD_ADDR: 127.0.0.1:4150
      QT_NSQ_LOOKUPD_ADDR: 127.0.0.1:4161
      QT_MINIO_ENDPOINT: 127.0.0.1:9000
      QT_JWT_SECRET: qingtian-secret-key
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-scheduler
    restart: unless-stopped
    network_mode: host
    command: ./scheduler -config configs/scheduler.yaml
    environment:
      QT_MONGO_URI: mongodb://127.0.0.1:27017
      QT_REDIS_ADDR: 127.0.0.1:6379
      QT_NSQD_ADDR: 127.0.0.1:4150
      QT_NSQ_LOOKUPD_ADDR: 127.0.0.1:4161
      QT_MINIO_ENDPOINT: 127.0.0.1:9000
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio

  agent:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qingtian-agent
    restart: unless-stopped
    network_mode: host
    command: ./agent -config configs/agent.yaml
    environment:
      QT_MONGO_URI: mongodb://127.0.0.1:27017
      QT_REDIS_ADDR: 127.0.0.1:6379
      QT_NSQD_ADDR: 127.0.0.1:4150
      QT_NSQ_LOOKUPD_ADDR: 127.0.0.1:4161
      QT_MINIO_ENDPOINT: 127.0.0.1:9000
      QT_CONTROL_PLANE_URL: http://127.0.0.1:8080
    depends_on:
      - mongodb
      - redis
      - nsqd
      - minio

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qingtian-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NGINX_PORT=80
      - API_SERVER=127.0.0.1
    depends_on:
      - apiserver

volumes:
  mongodb_data:
  redis_data:
  minio_data: